# Speed up file transfer by using sendfile().
sendfile on;

# Don't send partial frames, which increases throughput.
tcp_nopush on;

# Don't wait to send data in keep-alive state.
tcp_nodelay on;

# SSL terminates at the reverse proxy, so the upstream request reaches this
# server over plain HTTP. Derive an HTTPS flag from the proxy's forwarded
# scheme and pass it to php-fpm (see common/php.conf) so apps generate correct
# https URLs and avoid mixed-content under SSL.
map $http_x_forwarded_proto $fastcgi_https {
    default '';
    https on;
}

# The PHP location stores pages that set a cookie (see common/wpfc-php.conf). Do not
# store a redirect or an error that sets a cookie: a cookie-gated redirect would loop
# for every visitor. Do not store a page that starts a WooCommerce session: its nonces
# are valid only for that session.
map "$upstream_status $upstream_http_set_cookie" $fastcgi_no_cache_cookie_response {
    "~^200 (?!.*wp_woocommerce_session_)" 0;
    "~^[0-9]+ ." 1;
    default 0;
}
